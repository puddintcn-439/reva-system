name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend deps
        run: |
          cd backend
          npm ci
      - name: Run backend tests (with coverage)
        run: |
          cd backend
          npm run test:ci
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
      - name: Post coverage summary to PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs')
            const { context, github } = require('@actions/github')
            const covPath = 'backend/coverage/coverage-summary.json'
            if (!fs.existsSync(covPath)) {
              console.log('No coverage-summary.json found; skipping PR comment.')
              return
            }
            const data = JSON.parse(fs.readFileSync(covPath, 'utf8'))
            const total = data.total || data
            const fmt = (k) => {
              const v = total[k] || {}
              return `${v.pct ?? 0}% (${v.covered ?? 0}/${v.total ?? 0})`
            }
            const body = `### Jest Coverage Summary\n\n- **Statements:** ${fmt('statements')}\n- **Branches:** ${fmt('branches')}\n- **Functions:** ${fmt('functions')}\n- **Lines:** ${fmt('lines')}\n\n[View workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
            const issue_number = context.issue.number
            if (!issue_number) {
              console.log('No pull request number in context; skipping comment.')
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            })

  frontend-smoke:
    name: Frontend build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps and build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Smoke test dist exists
        run: |
          if [ -f frontend/dist/index.html ]; then echo "dist exists"; else echo "dist missing"; exit 1; fi
